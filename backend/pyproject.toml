[project]
name = "fillframe"
version = "0.1.0"
description = "FillFrame: backend (API local)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "pillow",
    "python-multipart",
]

[project.scripts]
fillframe = "app.main:rodar"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
